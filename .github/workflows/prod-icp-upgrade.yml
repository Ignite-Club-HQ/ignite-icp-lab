name: Production ICP Backend Upgrade

on:
  workflow_dispatch:
    inputs:
      canisters:
        description: >-
          Space-separated canister names to deploy/upgrade on mainnet (must
          match names in icp.yaml). Defaults to the smallest proven pair from
          the production launch plan's Phase 3 — do not widen this without
          reviewing docs/PRODUCTION_LAUNCH_PLAN.md first.
        required: true
        default: 'identity_access club_domain'
        type: string
      mode:
        description: 'Deployment mode'
        required: true
        default: 'upgrade'
        type: choice
        options:
          - upgrade
          - install

permissions:
  contents: read

jobs:
  production-upgrade:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    env:
      ICP_MODE: ${{ inputs.mode || 'upgrade' }}
      ICP_CANISTERS: ${{ inputs.canisters || 'identity_access club_domain' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Guard against missing production secrets
        shell: bash
        run: |
          test -n "${{ secrets.ICP_IDENTITY_PEM_BASE64 || '' }}" || {
            echo "ICP_IDENTITY_PEM_BASE64 is required for production canister upgrade." >&2
            exit 1
          }

      - name: Write ICP identity
        shell: bash
        run: |
          mkdir -p .icp
          printf '%s' '${{ secrets.ICP_IDENTITY_PEM_BASE64 }}' | base64 --decode > .icp/production-identity.pem
          chmod 600 .icp/production-identity.pem

      - name: Validate Rust and app gates
        run: |
          cargo test --workspace --locked
          cd frontend
          npm run check:isolation
          npm run check:prod-secrets
          npm run deploy:staging
          npm run build

      - name: Install ICP CLI
        shell: bash
        run: |
          npm install -g @icp-sdk/icp-cli @icp-sdk/ic-wasm
          icp --version

      - name: Build ICP backend artifacts
        run: |
          cargo build --workspace --release
          cargo build --workspace --target wasm32-unknown-unknown --release

      - name: Import mainnet deployment identity
        shell: bash
        run: |
          # icp-cli's `ic` environment/network is built in and protected —
          # it always targets https://icp-api.io, so no --network/--url flags
          # exist on `icp deploy` (that was the legacy dfx flag shape). See
          # docs/PRODUCTION_LAUNCH_PLAN.md Phase 3 for the full rationale.
          # `--storage plaintext` is used because this runner is a fresh,
          # single-job, ephemeral VM with no persistent keyring service; the
          # PEM and imported key both live only for this job's lifetime.
          icp identity import \
            --from-pem .icp/production-identity.pem \
            --storage plaintext \
            production-deployer
          icp identity default production-deployer
          rm -f .icp/production-identity.pem

      - name: Upgrade ICP canisters
        shell: bash
        run: |
          # NOTE: identity_access's icp.yaml `init_args` currently points at
          # a lab-only local bootstrap file (.local-icp/identity-init.bin,
          # gitignored, produced by scripts/local-icp.mjs). That file will
          # NOT exist on a fresh CI checkout, so a fresh (non-upgrade)
          # install of identity_access will fail here until a mainnet-
          # appropriate init argument (the canister's real `governor`
          # principal) is decided and wired in — see
          # docs/PRODUCTION_LAUNCH_PLAN.md Phase 3. Upgrades of an
          # already-installed identity_access canister are unaffected since
          # init args only apply to first install.
          icp deploy -e ic $ICP_CANISTERS \
            --identity production-deployer \
            --mode "$ICP_MODE" \
            --project-root-override "$GITHUB_WORKSPACE" \
            -y

      - name: Smoke verification post-upgrade
        shell: bash
        run: |
          icp canister status $ICP_CANISTERS -e ic --identity production-deployer
          echo "Production upgrade workflow reached the post-upgrade validation gate."
          echo "This step should verify the upgraded canister endpoints and callback health before release."
          echo "No production credentials or real user data are used in this workflow."
